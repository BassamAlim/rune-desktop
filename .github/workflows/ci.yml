name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      # Includes the shared vectors, which are the contract with rune-android. The tests that
      # need a keyring, a clipboard or a GPU are ignored by default and stay that way here.
      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rune-desktop-linux-x86_64
          path: target/release/rune-desktop
