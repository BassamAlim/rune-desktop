[package]
name = "rune-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/BassamAlim/rune-desktop"

[dependencies]
argon2 = "0.6.0"
hex = "0.4.3"
hmac = "0.13.0"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

