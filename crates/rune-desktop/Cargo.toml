[package]
name = "rune-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/BassamAlim/rune-desktop"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
rune-core = { version = "0.1.0", path = "../rune-core" }
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
egui-phosphor = "0.14.0"
keyring = "4.2.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
ureq = "2.12.1"
zeroize = "1.9.1"
zxcvbn = "3.1.1"
hex = "0.4.3"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
